<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Processor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #18181c;
      --border: #2a2a30;
      --text: #e8e8ec;
      --muted: #8888a0;
      --accent: #7c5cff;
      --accent-hover: #9b82ff;
      --success: #34d399;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem 0;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(124,92,255,0.06); }
    .upload-zone input { display: none; }
    .upload-zone p { margin: 0; color: var(--muted); }
    .upload-zone .primary { color: var(--text); font-weight: 600; margin-bottom: 0.25rem; }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (max-width: 600px) { .preview-row { grid-template-columns: 1fr; } }
    .preview-box {
      background: var(--bg);
      border-radius: 8px;
      padding: 0.75rem;
      border: 1px solid var(--border);
    }
    .preview-box label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.5rem; }
    .preview-box img { max-width: 100%; height: auto; border-radius: 6px; display: block; }
    .ops {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
    }
    .ops label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.9rem; }
    .ops input[type="checkbox"] { width: 1.1em; height: 1.1em; accent-color: var(--accent); }
    .inline-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .inline-group input[type="number"] {
      width: 5rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #3a3a42; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .msg.error { background: rgba(248,113,113,0.15); color: var(--error); }
    .msg.success { background: rgba(52,211,153,0.15); color: var(--success); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Image Processor</h1>
    <p class="sub">Upload an image, pick operations, and get the result. Powered by gRPC + Pillow.</p>

    <div class="card">
      <h2>1. Upload image</h2>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" />
        <p class="primary">Drop an image here or click to choose</p>
        <p>JPEG, PNG, WebP, etc.</p>
      </div>
    </div>

    <div class="card">
      <h2>2. Operations</h2>
      <div class="ops">
        <label><input type="checkbox" name="op" value="flip_horizontal" /> Flip horizontal</label>
        <label><input type="checkbox" name="op" value="flip_vertical" /> Flip vertical</label>
        <label><input type="checkbox" name="op" value="rotate_left" /> Rotate left</label>
        <label><input type="checkbox" name="op" value="rotate_right" /> Rotate right</label>
        <label><input type="checkbox" name="op" value="grayscale" /> Grayscale</label>
        <label><input type="checkbox" name="op" value="resize" /> Resize</label>
        <span class="inline-group">
          <input type="number" id="resizeW" placeholder="W" min="1" value="800" />
          <span>×</span>
          <input type="number" id="resizeH" placeholder="H" min="1" value="600" />
        </span>
        <label><input type="checkbox" name="op" value="rotate_degrees" /> Rotate</label>
        <span class="inline-group">
          <input type="number" id="rotateAngle" placeholder="°" value="90" />
          <span>°</span>
        </span>
        <label><input type="checkbox" id="genThumb" /> Thumbnail</label>
        <span class="inline-group">
          <input type="number" id="thumbW" placeholder="W" min="1" value="128" />
          <span>×</span>
          <input type="number" id="thumbH" placeholder="H" min="1" value="128" />
        </span>
      </div>
    </div>

    <div class="card">
      <h2>3. Process</h2>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="processBtn" disabled>Process image</button>
      </div>
      <div id="message" class="msg hidden"></div>
    </div>

    <div class="card preview-row hidden" id="resultCard">
      <div class="preview-box">
        <label>Original</label>
        <img id="previewOriginal" alt="Original" />
      </div>
      <div class="preview-box">
        <label>Result</label>
        <img id="previewResult" alt="Result" />
      </div>
    </div>
    <div class="card hidden" id="thumbCard">
      <div class="preview-box">
        <label>Thumbnail</label>
        <img id="previewThumb" alt="Thumbnail" />
      </div>
    </div>
    <div class="card hidden" id="downloadCard">
      <div class="actions">
        <a id="downloadLink" class="btn btn-secondary" href="#" download="processed.png">Download result</a>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadZone = document.getElementById("uploadZone");
    const processBtn = document.getElementById("processBtn");
    const message = document.getElementById("message");
    const resultCard = document.getElementById("resultCard");
    const thumbCard = document.getElementById("thumbCard");
    const downloadCard = document.getElementById("downloadCard");
    const previewOriginal = document.getElementById("previewOriginal");
    const previewResult = document.getElementById("previewResult");
    const previewThumb = document.getElementById("previewThumb");
    const downloadLink = document.getElementById("downloadLink");

    let selectedFile = null;

    uploadZone.addEventListener("click", () => fileInput.click());
    uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); uploadZone.classList.add("dragover"); });
    uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("dragover"));
    uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadZone.classList.remove("dragover");
      const f = e.dataTransfer?.files?.[0];
      if (f && f.type.startsWith("image/")) setFile(f);
    });
    fileInput.addEventListener("change", () => { const f = fileInput.files?.[0]; if (f) setFile(f); });

    function setFile(file) {
      selectedFile = file;
      processBtn.disabled = false;
      previewOriginal.src = URL.createObjectURL(file);
      resultCard.classList.remove("hidden");
      thumbCard.classList.add("hidden");
      downloadCard.classList.add("hidden");
      hideMessage();
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = "msg " + (isError ? "error" : "success");
      message.classList.remove("hidden");
    }
    function hideMessage() { message.classList.add("hidden"); }

    function buildOperations() {
      const ops = [];
      document.querySelectorAll('input[name="op"]:checked').forEach((cb) => {
        const type = cb.value;
        if (type === "resize") {
          const w = parseInt(document.getElementById("resizeW").value, 10) || 800;
          const h = parseInt(document.getElementById("resizeH").value, 10) || 600;
          ops.push({ type: "resize", width: w, height: h });
        } else if (type === "rotate_degrees") {
          const angle = parseInt(document.getElementById("rotateAngle").value, 10) || 90;
          ops.push({ type: "rotate_degrees", angle });
        } else {
          ops.push({ type });
        }
      });
      return ops;
    }

    processBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      processBtn.disabled = true;
      hideMessage();
      const form = new FormData();
      form.append("file", selectedFile);
      form.append("operations", JSON.stringify(buildOperations()));
      form.append("generate_thumbnail", document.getElementById("genThumb").checked ? "true" : "false");
      form.append("thumbnail_width", document.getElementById("thumbW").value || 128);
      form.append("thumbnail_height", document.getElementById("thumbH").value || 128);

      try {
        const r = await fetch("/api/process", { method: "POST", body: form });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          showMessage(data.detail || r.statusText || "Request failed", true);
          return;
        }
        previewResult.src = "data:image/png;base64," + data.processed_image;
        downloadLink.href = previewResult.src;
        downloadCard.classList.remove("hidden");
        if (data.thumbnail_image) {
          previewThumb.src = "data:image/png;base64," + data.thumbnail_image;
          thumbCard.classList.remove("hidden");
        } else {
          thumbCard.classList.add("hidden");
        }
        showMessage("Done. You can download the result below.", false);
      } catch (e) {
        showMessage("Network error: " + e.message, true);
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
